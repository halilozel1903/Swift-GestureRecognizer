name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Pick an iOS simulator
        id: simulator
        run: |
          udid="$(
            xcrun simctl list devices available -j |
            python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = []
          for runtime, rows in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in rows:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      devices.append(device)
          if not devices:
              print("No available iPhone simulator", file=sys.stderr)
              sys.exit(1)
          # Prefer newest iPhone 17 family when present.
          preferred = next(
              (d for d in devices if d["name"].startswith("iPhone 17")),
              devices[-1],
          )
          print(preferred["udid"])
          '
          )"
          if [ -z "${udid}" ]; then
            echo "Failed to resolve an iPhone simulator UDID" >&2
            exit 1
          fi
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "${udid}" || true

      - name: Build
        run: |
          xcodebuild build \
            -project GestureRecognizer.xcodeproj \
            -scheme GestureRecognizer \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Test
        run: |
          xcodebuild test \
            -project GestureRecognizer.xcodeproj \
            -scheme GestureRecognizer \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict
